name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Windows and Linux behaviour that cannot be reproduced on a developer's
  # machine gets investigated here, on a branch, without opening a pull request
  # to do it.
  workflow_dispatch:

jobs:
  library:
    name: library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The native archives are committed under libs/, so this links the same
      # prebuilt libraries a consumer of the module would get. A library build
      # does not link, so a missing symbol only surfaces under `go test`.
      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # A separate job rather than another step, so a failing library test does not
  # hide whether the example still builds.
  example:
    name: example (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The example is an ebiten app; its cgo build needs the X11/GL headers
      # that the runner does not ship. Xvfb because ebiten opens a window from
      # `internal/ui`'s package `init`, so every test binary here needs a
      # display even though none of the tests draw. The fonts because the
      # discovery tests measure real glyphs: a bare runner has neither a
      # colour emoji font nor anything with Korean in it.
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libasound2-dev xvfb xauth \
            fonts-noto-color-emoji fonts-noto-cjk

      # The example is its own module; go.work builds it against this checkout
      # rather than the gostty version its go.mod pins.
      - name: Vet example
        run: go vet ./examples/hypercat/...

      # Windows gets the compile and nothing more: hypercat is a POSIX app.
      # Its shell sessions go through creack/pty, which has no Windows
      # implementation, and its colour emoji wants a bitmap font where Windows
      # ships COLR outlines -- both of which the example says out loud rather
      # than works around, so the tests that cover them have nothing to say
      # there.
      - name: Build example
        if: runner.os != 'Linux'
        run: go build ./examples/hypercat/...

      - name: Test example
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./examples/hypercat/...
